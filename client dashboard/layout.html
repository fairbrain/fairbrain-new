<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Layout</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dash: {
                            bg: '#f8f4f9',
                            text: '#4a4d70',
                            textLight: '#9495b5',
                            cardBlue: '#1b326b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top left, #ffe3ec, transparent 40%),
                        radial-gradient(circle at top right, #eaddfc, transparent 40%),
                        radial-gradient(circle at bottom left, #ebf4ff, transparent 40%),
                        radial-gradient(circle at bottom right, #fdf1e3, transparent 40%);
            background-color: #f7f3fb; /* Fallback base color */
            min-height: 100vh;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(74, 77, 112, 0.2);
            border-radius: 10px;
        }
        .main-content-bg {
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 2rem 0 0 0;
            box-shadow: -10px -10px 20px rgba(255,255,255,0.5), 10px 10px 20px rgba(0,0,0,0.02);
        }
        .tab-gradient {
            background: linear-gradient(to right, #cf9dec, #4ea5ac);
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            border: 1px solid #cf9dec;
            transition: all 0.3s ease;
        }
        .tab-gradient.active, .tab-gradient:hover {
            background: linear-gradient(to right, #cf9dec, #4ea5ac);
            color: white;
            border-color: transparent;
            -webkit-text-fill-color: white;
            box-shadow: 0 4px 15px rgba(207, 157, 236, 0.3);
        }
    </style>
</head>
<body class="font-sans text-dash-text antialiased overflow-hidden flex h-screen">

    <!-- Sidebar -->
    <aside class="w-64 flex-shrink-0 flex flex-col p-6 pb-8 z-20 h-full overflow-y-auto">
        <div class="flex items-center gap-4 mb-10">
            <div class="w-12 h-12 rounded-2xl bg-white shadow-sm flex items-center justify-center font-bold text-xl text-dash-text">.D</div>
            <div class="leading-tight">
                <div class="font-semibold text-dash-text">Client</div>
                <div class="font-semibold text-dash-text">Name</div>
            </div>
        </div>
        
        <div class="mb-4 text-sm font-semibold text-dash-text">Menu</div>
        <nav class="flex flex-col gap-2 mb-8">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-dash-text/70 hover:bg-white/30 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Home</span>
            </a>
            <a href="messages.html" class="flex items-center gap-3 px-4 py-3 text-dash-text/70 hover:bg-white/30 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span>Messages</span>
            </a>
            <a href="layout.html" class="flex items-center justify-between px-4 py-3 rounded-xl bg-white/40 font-semibold shadow-sm text-dash-text transition-all">
                <div class="flex items-center gap-3 text-dash-cardBlue">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span>Layout</span>
                </div>
                <div class="w-1.5 h-1.5 rounded-full bg-dash-cardBlue shadow-[0_0_4px_#1b326b]"></div>
            </a>
            <a href="document.html" class="flex items-center gap-3 px-4 py-3 text-dash-text/70 hover:bg-white/30 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                <span>Document</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-dash-text/70 hover:bg-white/30 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path></svg>
                <span>Application</span>
            </a>
        </nav>
        
        <div class="mb-4 text-sm font-semibold text-dash-text mt-8">Configuration</div>
        <nav class="flex flex-col gap-2 flex-grow">
            <!-- Settings buttons -->
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-dash-text/70 hover:bg-white/30 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span>Stack dev</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-dash-text/70 hover:bg-white/30 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Settings</span>
            </a>
            <div class="flex items-center gap-3 px-4 py-3 text-dash-text/70 mt-auto font-medium justify-between group">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg class="w-5 h-5 hidden dark:block text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span id="theme-text">Light Mode</span>
                </div>
                <!-- Toggle Button -->
                <button type="button" id="theme-toggle-btn" aria-label="Toggle Dark Mode" class="w-10 h-5 bg-black/10 dark:bg-dash-cardBlue rounded-full relative shadow-inner cursor-pointer transition-colors duration-300 outline-none">
                    <div id="theme-toggle-dot" class="w-6 h-6 bg-dash-text dark:bg-white rounded-full absolute -top-0.5 left-0 shadow-md transition-transform duration-300 flex items-center justify-center">
                    </div>
                </button>
            </div>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-grow flex flex-col h-full overflow-hidden">
        
        <!-- Header -->
        <header class="h-24 flex items-center justify-between px-8 flex-shrink-0">
            <div class="relative w-80 lg:w-[400px]">
                <input type="text" placeholder="Type in to search .." class="w-full h-11 pl-6 pr-10 rounded-full bg-white shadow-sm border-white border text-sm focus:outline-none placeholder-dash-textLight text-dash-text font-medium">
                <svg class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-dash-textLight" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            
            <div class="flex items-center gap-6 text-dash-textLight">
                <button class="hover:text-dash-text transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z"></path></svg></button>
                <button class="hover:text-dash-text transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg></button>
                <button class="hover:text-dash-text transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg></button>
                <div class="h-6 w-px bg-dash-textLight/30 mx-2"></div>
                <button class="relative hover:text-dash-text transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span class="absolute -top-1.5 -right-1.5 bg-dash-cardBlue text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-white">11</span>
                </button>
                <button class="hover:text-dash-text transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></button>
                <button class="relative hover:text-dash-text transition-colors text-dash-text">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"></path></svg>
                    <span class="absolute -top-1 -right-1 bg-dash-cardBlue text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-white">7</span>
                </button>
                <div class="relative group ml-2 py-2">
                    <div class="w-10 h-10 rounded-full bg-white shadow-sm border border-white/50 p-0.5 overflow-hidden cursor-pointer dark:border-white/10 dark:bg-[#1e2030]/60">
                        <img src="https://i.pravatar.cc/150?img=11" alt="Profile"
                            class="w-full h-full rounded-full object-cover">
                    </div>
                    <!-- Dropdown Menu -->
                    <div class="absolute right-0 top-full mt-1 w-48 bg-white/90 backdrop-blur-md rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.1)] border border-white opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50 transform origin-top-right group-hover:translate-y-0 translate-y-2 dark:bg-[#1e2030]/95 dark:border-white/10">
                        <div class="p-2 space-y-1">
                            <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-dash-text dark:text-dash-textLight hover:bg-white dark:hover:bg-white/5 rounded-lg transition-colors font-medium">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                View Profile
                            </a>
                            <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-dash-text dark:text-dash-textLight hover:bg-white dark:hover:bg-white/5 rounded-lg transition-colors font-medium">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0..."></path></svg>
                                Settings
                            </a>
                            <div class="border-t border-dash-textLight/20 dark:border-white/10 my-1"></div>
                            <a href="#" class="flex items-center gap-2 px-3 py-2 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 rounded-lg transition-colors font-medium">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Content Container (Layouts) -->
        <main class="main-content-bg flex-grow flex flex-col p-8 pt-6 pb-0 overflow-hidden w-full relative">
            <div class="max-w-5xl w-full mx-auto h-full flex flex-col">
                <!-- Layout Tabs -->
                <div class="flex gap-4 mb-6">
                    <button class="tab-gradient active px-10 py-3 rounded-full font-bold text-sm tracking-wider uppercase">BANNER</button>
                    <button class="tab-gradient px-10 py-3 rounded-full font-bold text-sm tracking-wider uppercase">V CARD</button>
                    <button class="tab-gradient px-10 py-3 rounded-full font-bold text-sm tracking-wider uppercase">PACKAGING</button>
                    <button class="tab-gradient px-10 py-3 rounded-full font-bold text-sm tracking-wider uppercase">LOGO</button>
                    <button class="tab-gradient px-10 py-3 rounded-full font-bold text-sm tracking-wider uppercase">POSTER</button>
                </div>
                
                <!-- Layout Grid Container -->
                <div class="flex-grow overflow-y-auto pr-4 pb-8">
                    <div class="grid grid-cols-3 gap-6">
                        <!-- Cards -->
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                        <div class="bg-white rounded-[2rem] aspect-[4/3] shadow-sm border border-white/60"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="theme.js"></script>
</body>
</html>
